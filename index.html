<!doctype html>
<html>

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">

  <title>Nomad Hub AR – test</title>
  <script crossorigin="anonymous" src="./external/scripts/8frame-1.5.0.min.js"></script>

  <script src="https://cdn.jsdelivr.net/npm/@8thwall/engine-binary@1/dist/xr.js" async crossorigin="anonymous" data-preload-chunks="slam"></script>
  <script src="https://cdn.jsdelivr.net/npm/@8thwall/landing-page@1/dist/landing-page.js" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/@8thwall/xrextras@1/dist/xrextras.js" crossorigin="anonymous"></script>
  <script src="./config.js"></script>
  <script src="./app.js"></script>

  <style>
    #hud {
      position: fixed; left: 8px; bottom: 8px; z-index: 10;
      font: 12px/1.4 monospace; color: #0f0; background: rgba(0,0,0,.6);
      padding: 4px 6px; white-space: pre; pointer-events: none;
    }
    #hud:empty { display: none; }
    #offscreen {
      position: fixed; z-index: 10; display: none; transform: translate(-50%, -50%);
      pointer-events: none;
    }
    #offscreen .arrow {
      font-size: 44px; line-height: 1; color: #2ee6a6; text-shadow: 0 1px 3px rgba(0,0,0,.8);
    }
    #offscreen-text {
      /* Above the record button */
      position: fixed; z-index: 10; left: 50%; bottom: 140px; transform: translateX(-50%);
      display: none; padding: 8px 14px; border-radius: 18px; background: rgba(0,0,0,.6);
      font: 600 15px/1.2 system-ui, sans-serif; color: #fff; white-space: nowrap;
      pointer-events: none;
    }
    #edit-panel {
      position: fixed; z-index: 20; left: 8px; right: 8px; top: 8px; display: none;
      max-height: 32vh; overflow-y: auto; padding: 0 12px 10px; border-radius: 12px;
      background: rgba(0,0,0,.65);
    }
    #edit-panel button {
      width: 100%; padding: 8px; border: 0; border-radius: 8px;
      background: #2ee6a6; color: #000; font: 600 14px system-ui, sans-serif;
    }
  </style>
</head>

<body>
  <div id="hud"></div>
  <div id="offscreen"><div class="arrow">➜</div></div>
  <div id="offscreen-text"></div>
  <div id="edit-panel"></div>

  <!-- Stamped by the script below, so ?desktop can change xrweb before it initialises -->
  <template id="scene-tpl">
  <a-scene landing-page xrextras-loading xrextras-runtime-error
    renderer="colorManagement: true" pixel-ratio-cap env-map="src: assets/envmap-city.jpg" xrweb>

    <a-assets>
      <a-asset-item id="jaula-glb" src="assets/jaula.glb"></a-asset-item>
    </a-assets>

    <a-camera position="0 1.4 0"></a-camera>

    <!-- Floating record button (tap to start, tap to stop), then a preview with
         share/save. 8th Wall's built-in recorder; no end card, no mic prompt. -->
    <xrextras-capture-button capture-mode="fixed"></xrextras-capture-button>
    <xrextras-capture-config
      max-duration-ms="30000"
      max-dimension="1280"
      enable-end-card="false"
      file-name-prefix="nomad-hub-"
      request-mic="manual"
      include-scene-audio="false"></xrextras-capture-config>
    <xrextras-capture-preview
      action-button-share-text="Compartir"
      action-button-view-text="Ver"
      finalize-text="Exportando..."></xrextras-capture-preview>

    <a-light type="directional" intensity="0.8" position="1 2 1"></a-light>
    <a-light type="ambient" intensity="0.4"></a-light>

    <!-- ?debug only: outline of the tracked QR, with its local axes -->
    <a-entity id="qr-marker" visible="false">
      <a-plane width="1" height="1" material="color: #0f0; wireframe: true"></a-plane>
      <a-entity line="start: 0 0 0; end: 0.5 0 0; color: red"></a-entity>
      <a-entity line="start: 0 0 0; end: 0 0.5 0; color: lime"></a-entity>
      <a-entity line="start: 0 0 0; end: 0 0 0.5; color: blue"></a-entity>
    </a-entity>

    <a-entity qr-table-anchor>
      <a-entity gltf-model="#jaula-glb"></a-entity>
    </a-entity>
  </a-scene>
  </template>

  <script>
    const frag = document.importNode(document.getElementById('scene-tpl').content, true)
    if (DESKTOP) {
      // Webcam, no motion sensors: skip the "open on your phone" page, no SLAM.
      const scene = frag.querySelector('a-scene')
      scene.removeAttribute('landing-page')
      scene.setAttribute('xrweb', 'allowedDevices: any; disableWorldTracking: true')
    }
    document.body.appendChild(frag)
  </script>
</body>

</html>
